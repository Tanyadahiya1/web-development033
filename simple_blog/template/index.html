{% extends 'base.html' %}

{% block content %}
<h1>All Blog Posts</h1>

{% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>

        <a href="/edit/{{ loop.index0 }}">Edit</a>
        <a href="/delete/{{ loop.index0 }}">Delete</a>
    </div>
{% else %}
    <p>No posts available.</p>
{% endfor %}

{% endblock %}
